name: Update Dashboard Saham

on:
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '15 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install library
        run: pip install -r requirements.txt

      - name: Generate data.json
        run: python bot.py

      - name: Commit & push data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Update data saham $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
