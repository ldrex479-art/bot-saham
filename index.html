<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug</title>
<style>
body{background:#0a0e14;color:#e6edf3;font-family:monospace;padding:20px;font-size:12px;line-height:1.6;}
h1{color:#26d07c;margin-bottom:15px;}
.ok{color:#26d07c;}
.err{color:#ff4d4f;}
.info{color:#d4a84b;}
pre{background:#161d2b;padding:10px;border-radius:8px;overflow-x:auto;margin:10px 0;border:1px solid #232c3d;font-size:11px;}
button{background:#d4a84b;color:#000;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>
<h1>🔍 Debug Data Load</h1>
<div id="output">Loading...</div>
<button onclick="test()">🔄 Test Lagi</button>

<script>
async function test(){
  const out = document.getElementById('output');
  out.innerHTML = '<div class="info">⏳ Fetching data.json...</div>';
  try {
    const url = 'data.json?v=' + Date.now();
    const r = await fetch(url);
    let log = '<div class="ok">✅ Fetch berhasil!</div>';
    log += '<div>Status: <b>' + r.status + '</b></div>';
    log += '<div>OK: <b>' + r.ok + '</b></div>';
    log += '<div>Content-Type: <b>' + r.headers.get('content-type') + '</b></div>';
    log += '<div>URL: <b>' + r.url + '</b></div>';
    
    const text = await r.text();
    log += '<div>Ukuran text: <b>' + text.length + ' karakter</b></div>';
    log += '<div>10 karakter pertama: <pre>' + text.substring(0, 200) + '</pre></div>';
    
    try {
      const data = JSON.parse(text);
      log += '<div class="ok">✅ JSON valid!</div>';
      log += '<div>Total saham: <b>' + (data.saham ? data.saham.length : 0) + '</b></div>';
      log += '<div>Updated: <b>' + (data.updated || '-') + '</b></div>';
      if(data.saham && data.saham[0]){
        log += '<div>Saham pertama: <b>' + data.saham[0].kode + '</b></div>';
        log += '<div>Punya candles: <b>' + (data.saham[0].candles ? data.saham[0].candles.length : 'TIDAK') + '</b></div>';
      }
    } catch(e) {
      log += '<div class="err">❌ JSON PARSE ERROR: ' + e.message + '</div>';
    }
    
    out.innerHTML = log;
  } catch(e) {
    out.innerHTML = '<div class="err">❌ FETCH ERROR: ' + e.message + '</div>' +
      '<div class="err">Error name: ' + e.name + '</div>' +
      '<div class="info">Kemungkinan: CORS, network, atau file nggak ada</div>';
  }
}
test();
</script>
</body>
</html>
