<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Saham IHSG Pro</title>
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0e14;--bg2:#111720;--card:#161d2b;--line:#232c3d;
  --text:#e6edf3;--muted:#7a8699;--green:#26d07c;--red:#ff4d4f;
  --yellow:#ffc107;--orange:#ff9800;--blue:#4a9eff;--gold:#d4a84b;
  --purple:#a06bff;
}
body.light{
  --bg:#f5f7fa;--bg2:#ffffff;--card:#ffffff;--line:#e1e6ec;
  --text:#1a2332;--muted:#5a6577;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:40px;transition:background 0.3s,color 0.3s;-webkit-font-smoothing:antialiased;}
.header{background:linear-gradient(180deg,var(--bg2),var(--bg));padding:20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);}
.header-inner{max-width:1200px;margin:0 auto;}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.title{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;}
.title h1{font-size:19px;font-weight:600;letter-spacing:-0.5px;}
.title .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold);}
.icon-btn.active{background:var(--gold);color:#000;border-color:var(--gold);}
.updated{font-size:10px;color:var(--muted);margin-top:5px;}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:11px;}
.stat .label{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.stat .value{font-weight:600;font-size:13px;}
.container{max-width:1200px;margin:0 auto;padding:15px;}
.section-title{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.section-title .left{display:flex;align-items:center;gap:8px;}
.section-title .left::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px;}
.movers-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.movers-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
.movers-box h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;font-weight:600;}
.mover-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;}
.mover-item:last-child{border-bottom:none;}
.mover-item:hover{color:var(--gold);}
.mover-item .kode-mover{font-weight:700;}
.alerts-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
.alert-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:11px;margin-bottom:5px;border-left:3px solid var(--muted);}
.alert-item:last-child{margin-bottom:0;}
.alert-bull{background:rgba(38,208,124,0.08);border-color:var(--green);}
.alert-bear{background:rgba(255,77,79,0.08);border-color:var(--red);}
.alert-warn{background:rgba(255,152,0,0.08);border-color:var(--orange);}
.alert-info{background:rgba(74,158,255,0.08);border-color:var(--blue);}
.alert-kode{font-weight:700;color:var(--gold);}
.sector-heat{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;}
.sector-chip{flex-shrink:0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);min-width:120px;cursor:pointer;transition:all 0.3s;}
.sector-chip:hover{transform:translateY(-2px);border-color:var(--gold);}
.sector-chip .sname{font-size:11px;font-weight:600;letter-spacing:0.3px;}
.sector-chip .sval{font-size:14px;font-weight:700;margin-top:3px;}
.sector-chip .scount{font-size:9px;color:var(--muted);margin-top:3px;}
.sector-chip.pos{background:rgba(38,208,124,0.08);border-color:rgba(38,208,124,0.3);}
.sector-chip.neg{background:rgba(255,77,79,0.08);border-color:rgba(255,77,79,0.3);}
.sector-chip.neu{background:rgba(122,134,153,0.08);}
.controls{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.search{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--text);font-size:12px;outline:none;}
.search:focus{border-color:var(--gold);}
.search::placeholder{color:var(--muted);}
.filters{display:flex;gap:5px;flex-wrap:wrap;}
.filter{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--text);font-size:11px;font-weight:500;cursor:pointer;transition:all 0.3s;white-space:nowrap;}
.filter:hover{border-color:var(--gold);}
.filter.active{background:var(--gold);color:#000;border-color:var(--gold);}
.select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--text);font-size:11px;outline:none;cursor:pointer;}
.recent-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.recent-chip{background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:20px;font-size:10px;cursor:pointer;color:var(--muted);transition:all 0.2s;}
.recent-chip:hover{color:var(--gold);border-color:var(--gold);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;transition:all 0.3s;position:relative;overflow:hidden;cursor:pointer;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--muted);}
.card.strong-bull::before,.card.bull::before{background:var(--green);}
.card.mild-bull::before{background:#8bc34a;}
.card.mild-bear::before{background:var(--orange);}
.card.bear::before,.card.strong-bear::before{background:var(--red);}
.card:hover{transform:translateY(-3px);border-color:var(--gold);}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.kode{font-size:16px;font-weight:700;letter-spacing:0.3px;}
.sektor{font-size:9px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-top:2px;}
.harga{font-size:12px;color:var(--muted);margin-top:4px;}
.harga span{font-weight:600;}
.up{color:var(--green);}
.down{color:var(--red);}
.star{position:absolute;top:12px;right:12px;font-size:16px;cursor:pointer;color:var(--line);background:none;border:none;padding:0;line-height:1;transition:all 0.2s;}
.star:hover{color:var(--gold);transform:scale(1.2);}
.star.on{color:var(--gold);}
.conf-bar{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:9px;color:var(--muted);}
.conf-bar .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
.conf-bar .bar div{height:100%;background:var(--gold);border-radius:2px;transition:width 0.5s;}
.verdict{font-size:9px;font-weight:600;padding:4px 8px;border-radius:20px;letter-spacing:0.6px;text-transform:uppercase;display:inline-block;margin-top:6px;}
.v-strong-bull,.v-bull{background:rgba(38,208,124,0.15);color:var(--green);}
.v-mild-bull{background:rgba(139,195,74,0.15);color:#8bc34a;}
.v-neutral{background:rgba(122,134,153,0.15);color:var(--muted);}
.v-mild-bear{background:rgba(255,152,0,0.15);color:var(--orange);}
.v-bear,.v-strong-bear{background:rgba(255,77,79,0.15);color:var(--red);}
.chart-wrap{height:50px;margin:8px 0 6px;position:relative;}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding-top:8px;border-top:1px solid var(--line);margin-top:6px;}
.metric .label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px;}
.metric .val{font-size:11px;font-weight:600;}
.sinyal{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;}
.sinyal-item{font-size:8px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.05);color:var(--muted);}
body.light .sinyal-item{background:rgba(0,0,0,0.05);}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;padding:15px;overflow-y:auto;backdrop-filter:blur(8px);}
.modal-bg.show{display:block;}
.modal{max-width:600px;margin:30px auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;animation:slideUp 0.3s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.modal-head h2{font-size:22px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0;}
.modal-close:hover{color:var(--red);}
.modal-chart{height:180px;margin:14px 0;position:relative;}
.modal-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.modal-stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
.modal-stat .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.modal-stat .val{font-size:14px;font-weight:600;}
.modal-action{margin-top:12px;padding:12px;border-radius:10px;font-size:12px;text-align:center;font-weight:500;}
.action-buy{background:rgba(38,208,124,0.12);color:var(--green);border:1px solid var(--green);}
.action-sell{background:rgba(255,77,79,0.12);color:var(--red);border:1px solid var(--red);}
.action-hold{background:rgba(122,134,153,0.12);color:var(--muted);border:1px solid var(--line);}
.modal-section{margin-top:14px;}
.modal-section h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.modal-notes{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font-size:12px;resize:vertical;min-height:60px;font-family:inherit;outline:none;}
.modal-notes:focus{border-color:var(--gold);}
.modal-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.modal-btn{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;font-size:11px;cursor:pointer;transition:all 0.3s;}
.modal-btn:hover{border-color:var(--gold);color:var(--gold);}
.modal-btn.primary{background:var(--gold);color:#000;border-color:var(--gold);}
.portfolio-item{display:flex;justify-content:space-between;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;}
.portfolio-item .pnama{font-weight:700;}
.portfolio-item .plot{font-size:10px;color:var(--muted);}
.portfolio-item .pval{text-align:right;}
.portfolio-item .ppl{font-size:11px;font-weight:600;}
.loading,.empty{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1;}
.loader{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.footer{text-align:center;padding:25px 20px;color:var(--muted);font-size:10px;max-width:1200px;margin:0 auto;}
.tab-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.tab{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all 0.3s;}
.tab.active{background:var(--gold);color:#000;border-color:var(--gold);}
.tab-content{display:none;}
.tab-content.active{display:block;}
input[type=number],input[type=text].input-t{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--text);font-size:12px;outline:none;width:100%;}
input[type=number]:focus,input[type=text].input-t:focus{border-color:var(--gold);}
.add-portfolio{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-bottom:12px;}
.add-portfolio button{background:var(--gold);color:#000;border:none;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;}
@media (max-width:600px){
  .movers-grid{grid-template-columns:1fr;}
  .modal{margin:15px auto;padding:15px;}
  .modal-chart{height:140px;}
  .add-portfolio{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="top-bar">
      <div class="title"><div class="dot"></div><h1>Dashboard Saham IHSG</h1></div>
      <button class="icon-btn" id="refreshBtn" title="Refresh">🔄</button>
      <button class="icon-btn" id="autoBtn" title="Auto refresh">⏱️</button>
      <button class="icon-btn" id="csvBtn" title="Export CSV">📥</button>
      <button class="icon-btn" id="themeBtn" title="Tema">🌙</button>
    </div>
    <div class="updated" id="updated">Memuat...</div>
    <div class="stats">
      <div class="stat"><div class="label">Total</div><div class="value" id="stat-total">-</div></div>
      <div class="stat"><div class="label">Bullish</div><div class="value" style="color:var(--green)" id="stat-bull">-</div></div>
      <div class="stat"><div class="label">Bearish</div><div class="value" style="color:var(--red)" id="stat-bear">-</div></div>
      <div class="stat"><div class="label">Alert</div><div class="value" style="color:var(--gold)" id="stat-alert">-</div></div>
    </div>
  </div>
</div>

<div class="container">
  <div class="tab-bar">
    <button class="tab active" data-tab="dash">📊 Dashboard</button>
    <button class="tab" data-tab="portfolio">💼 Portfolio</button>
    <button class="tab" data-tab="alerts">🔔 Alert Saya</button>
  </div>

  <div class="tab-content active" id="tab-dash">
    <div class="section-title"><div class="left">Alert & Sinyal</div></div>
    <div class="alerts-box" id="alerts-box"><div style="color:var(--muted);font-size:11px;">Memuat...</div></div>

    <div class="section-title"><div class="left">Performa Sektor</div></div>
    <div class="sector-heat" id="sector-heat"></div>

    <div class="section-title"><div class="left">Top Movers</div></div>
    <div class="movers-grid">
      <div class="movers-box"><h3>🚀 Top 5 Naik</h3><div id="top-naik"></div></div>
      <div class="movers-box"><h3>📉 Top 5 Turun</h3><div id="top-turun"></div></div>
    </div>

    <div class="section-title"><div class="left">Semua Saham</div><span style="font-size:10px;color:var(--muted);text-transform:none;letter-spacing:0;" id="count-info"></span></div>

    <div class="recent-bar" id="recent-bar"></div>

    <div class="controls">
      <input type="text" class="search" id="search" placeholder="Cari kode saham...">
      <select class="select" id="sectorFilter"><option value="all">Semua Sektor</option></select>
      <select class="select" id="sortFilter">
        <option value="skor">Sort: Skor</option>
        <option value="perubahan">Sort: Perubahan</option>
        <option value="harga">Sort: Harga</option>
        <option value="rsi">Sort: RSI</option>
        <option value="confidence">Sort: Confidence</option>
      </select>
    </div>
    <div class="controls">
      <div class="filters">
        <button class="filter active" data-filter="all">Semua</button>
        <button class="filter" data-filter="fav">⭐ Favorit</button>
        <button class="filter" data-filter="bull">Bullish</button>
        <button class="filter" data-filter="bear">Bearish</button>
        <button class="filter" data-filter="bb">Bollinger Extreme</button>
      </div>
    </div>

    <div class="grid" id="grid"><div class="loading"><div class="loader"></div>Memuat data saham...</div></div>
  </div>

  <div class="tab-content" id="tab-portfolio">
    <div class="section-title"><div class="left">Portfolio Saya</div></div>
    <div class="add-portfolio">
      <input type="text" class="input-t" id="pKode" placeholder="Kode (BBCA)">
      <input type="number" id="pLot" placeholder="Lot">
      <input type="number" id="pHarga" placeholder="Harga beli">
      <button id="pAdd">+ Tambah</button>
    </div>
    <div id="portfolio-list"></div>
  </div>

  <div class="tab-content" id="tab-alerts">
    <div class="section-title"><div class="left">Price Alert Saya</div></div>
    <div class="add-portfolio">
      <input type="text" class="input-t" id="aKode" placeholder="Kode (BBCA)">
      <input type="number" id="aHarga" placeholder="Target harga">
      <select class="select" id="aTipe" style="width:100%;">
        <option value="above">Naik ke atas</option>
        <option value="below">Turun ke bawah</option>
      </select>
      <button id="aAdd">+ Tambah</button>
    </div>
    <div id="alerts-list"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>

<div class="footer">
  ⚠️ Bukan rekomendasi beli/jual. DYOR.<br>
  Data dari Yahoo Finance · Delay ~15 menit
</div>

<script>
let allData = [];
let currentFilter = 'all';
let currentSearch = '';
let currentSector = 'all';
let currentSort = 'skor';
let favorites = JSON.parse(localStorage.getItem('saham_fav') || '[]');
let recentlyViewed = JSON.parse(localStorage.getItem('saham_recent') || '[]');
let portfolio = JSON.parse(localStorage.getItem('saham_portfolio') || '[]');
let priceAlerts = JSON.parse(localStorage.getItem('saham_price_alerts') || '[]');
let charts = {};
let autoRefreshTimer = null;

// ===== TABS =====
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    if (t.dataset.tab === 'portfolio') renderPortfolio();
    if (t.dataset.tab === 'alerts') renderPriceAlerts();
  });
});

// ===== THEME =====
const themeBtn = document.getElementById('themeBtn');
if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light');
  themeBtn.textContent = '☀️';
}
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  themeBtn.textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  render();
});

// ===== REFRESH =====
document.getElementById('refreshBtn').addEventListener('click', () => {
  document.getElementById('refreshBtn').style.transform = 'rotate(360deg)';
  setTimeout(() => document.getElementById('refreshBtn').style.transform = '', 500);
  loadData();
});

// ===== AUTO REFRESH =====
const autoBtn = document.getElementById('autoBtn');
if (localStorage.getItem('auto') === 'on') {
  autoBtn.classList.add('active');
  startAuto();
}
autoBtn.addEventListener('click', () => {
  if (autoRefreshTimer) {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
    autoBtn.classList.remove('active');
    localStorage.setItem('auto', 'off');
  } else {
    startAuto();
    autoBtn.classList.add('active');
    localStorage.setItem('auto', 'on');
  }
});
function startAuto() {
  autoRefreshTimer = setInterval(loadData, 5 * 60 * 1000);
}

// ===== CSV =====
document.getElementById('csvBtn').addEventListener('click', () => {
  if (!allData.length) return;
  const headers = ['Kode','Sektor','Harga','Perubahan %','MA20','MA50','RSI','BB Upper','BB Lower','Verdict','Confidence'];
  const rows = allData.map(s => [s.kode, s.sektor, s.harga, s.perubahan, s.ma20, s.ma50, s.rsi, s.bb_up, s.bb_low, s.verdict, s.confidence]);
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'saham_ihsg_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
});

// ===== FAVORIT =====
function toggleFav(kode) {
  const i = favorites.indexOf(kode);
  if (i >= 0) favorites.splice(i, 1); else favorites.push(kode);
  localStorage.setItem('saham_fav', JSON.stringify(favorites));
  render();
}
window.toggleFav = toggleFav;

// ===== RECENT =====
function addRecent(kode) {
  recentlyViewed = [kode, ...recentlyViewed.filter(k => k !== kode)].slice(0, 6);
  localStorage.setItem('saham_recent', JSON.stringify(recentlyViewed));
}

// ===== PORTFOLIO =====
document.getElementById('pAdd').addEventListener('click', () => {
  const kode = document.getElementById('pKode').value.trim().toUpperCase();
  const lot = parseFloat(document.getElementById('pLot').value);
  const harga = parseFloat(document.getElementById('pHarga').value);
  if (!kode || !lot || !harga) return alert('Isi semua field');
  portfolio.push({kode, lot, harga, tgl: new Date().toISOString()});
  localStorage.setItem('saham_portfolio', JSON.stringify(portfolio));
  document.getElementById('pKode').value = '';
  document.getElementById('pLot').value = '';
  document.getElementById('pHarga').value = '';
  renderPortfolio();
});

function renderPortfolio() {
  const list = document.getElementById('portfolio-list');
  if (portfolio.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px;">Belum ada saham di portfolio</div>';
    return;
  }
  let totalInvest = 0, totalValue = 0;
  let html = '';
  portfolio.forEach((p, i) => {
    const s = allData.find(x => x.kode === p.kode);
    const currentPrice = s ? s.harga : 0;
    const invest = p.lot * 100 * p.harga;
    const value = p.lot * 100 * currentPrice;
    const pl = value - invest;
    const plPct = invest > 0 ? (pl / invest * 100) : 0;
    totalInvest += invest;
    totalValue += value;
    html += `<div class="portfolio-item">
      <div>
        <div class="pnama">${p.kode} <span style="color:var(--muted);font-weight:400;font-size:11px;">× ${p.lot} lot</span></div>
        <div class="plot">Beli Rp ${p.harga.toLocaleString('id-ID')} · Kini Rp ${currentPrice.toLocaleString('id-ID')}</div>
      </div>
      <div class="pval">
        <div style="font-weight:600;">Rp ${value.toLocaleString('id-ID')}</div>
        <div class="ppl ${pl >= 0 ? 'up' : 'down'}">${pl >= 0 ? '+' : ''}Rp ${pl.toLocaleString('id-ID')} (${plPct.toFixed(2)}%)</div>
        <button onclick="removePortfolio(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:10px;margin-top:3px;">Hapus</button>
      </div>
    </div>`;
  });
  const totalPL = totalValue - totalInvest;
  const totalPct = totalInvest > 0 ? (totalPL / totalInvest * 100) : 0;
  html = `<div style="background:linear-gradient(135deg,rgba(212,168,75,0.15),rgba(212,168,75,0.05));border:1px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:12px;">
    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Total Portfolio</div>
    <div style="font-size:20px;font-weight:700;margin-top:4px;">Rp ${totalValue.toLocaleString('id-ID')}</div>
    <div style="font-size:12px;margin-top:4px;" class="${totalPL >= 0 ? 'up' : 'down'}">${totalPL >= 0 ? '▲' : '▼'} ${totalPL >= 0 ? '+' : ''}Rp ${totalPL.toLocaleString('id-ID')} (${totalPct.toFixed(2)}%)</div>
  </div>` + html;
  list.innerHTML = html;
}

function removePortfolio(i) {
  portfolio.splice(i, 1);
  localStorage.setItem('saham_portfolio', JSON.stringify(portfolio));
  renderPortfolio();
}
window.removePortfolio = removePortfolio;

// ===== PRICE ALERTS =====
document.getElementById('aAdd').addEventListener('click', () => {
  const kode = document.getElementById('aKode').value.trim().toUpperCase();
  const harga = parseFloat(document.getElementById('aHarga').value);
  const tipe = document.getElementById('aTipe').value;
  if (!kode || !harga) return alert('Isi semua field');
  priceAlerts.push({kode, harga, tipe});
  localStorage.setItem('saham_price_alerts', JSON.stringify(priceAlerts));
  document.getElementById('aKode').value = '';
  document.getElementById('aHarga').value = '';
  renderPriceAlerts();
});

function renderPriceAlerts() {
  const list = document.getElementById('alerts-list');
  if (priceAlerts.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px;">Belum ada price alert</div>';
    return;
  }
  list.innerHTML = priceAlerts.map((a, i) => {
    const s = allData.find(x => x.kode === a.kode);
    const cp = s ? s.harga : 0;
    const triggered = a.tipe === 'above' ? cp >= a.harga : cp <= a.harga;
    return `<div class="portfolio-item" style="${triggered ? 'border-color:var(--gold);background:rgba(212,168,75,0.08);' : ''}">
      <div>
        <div class="pnama">${a.kode} ${triggered ? '🔔' : ''}</div>
        <div class="plot">Alert kalau ${a.tipe === 'above' ? 'naik ke atas' : 'turun ke bawah'} Rp ${a.harga.toLocaleString('id-ID')}</div>
        <div class="plot">Sekarang: Rp ${cp.toLocaleString('id-ID')}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:10px;color:${triggered ? 'var(--gold)' : 'var(--muted)'};">${triggered ? 'TERPICU' : 'Menunggu'}</div>
        <button onclick="removeAlert(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:10px;margin-top:3px;">Hapus</button>
      </div>
    </div>`;
  }).join('');
}

function removeAlert(i) {
  priceAlerts.splice(i, 1);
  localStorage.setItem('saham_price_alerts', JSON.stringify(priceAlerts));
  renderPriceAlerts();
}
window.removeAlert = removeAlert;

// ===== LOAD DATA =====
async function loadData() {
  try {
    const r = await fetch('data.json?v=' + Date.now());
    if (!r.ok) throw new Error('nf');
    const data = await r.json();
    allData = data.saham || [];
    document.getElementById('updated').textContent = 'Update: ' + (data.updated || '-');
    const bull = allData.filter(x => x.skor >= 0.5).length;
    const bear = allData.filter(x => x.skor <= -0.5).length;
    document.getElementById('stat-total').textContent = allData.length;
    document.getElementById('stat-bull').textContent = bull;
    document.getElementById('stat-bear').textContent = bear;
    document.getElementById('stat-alert').textContent = (data.alerts || []).length;
    renderAlerts(data.alerts || []);
    renderMovers(data.top_naik || [], data.top_turun || []);
    renderSectorHeat(data.sector_perf || []);
    buildSectorFilter();
    renderRecent();
    render();
    renderPortfolio();
    renderPriceAlerts();
    checkPriceAlerts();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty">❌ Gagal memuat. Buka tab Actions → Run workflow.</div>';
  }
}

function checkPriceAlerts() {
  priceAlerts.forEach(a => {
    const s = allData.find(x => x.kode === a.kode);
    if (!s) return;
    const triggered = a.tipe === 'above' ? s.harga >= a.harga : s.harga <= a.harga;
    if (triggered && !a.notified) {
      a.notified = true;
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Alert ' + a.kode, {body: 'Harga Rp ' + s.harga.toLocaleString('id-ID')});
      }
    }
  });
  localStorage.setItem('saham_price_alerts', JSON.stringify(priceAlerts));
}

function renderRecent() {
  const bar = document.getElementById('recent-bar');
  if (recentlyViewed.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = '<span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;align-self:center;">Terakhir:</span>' +
    recentlyViewed.map(k => `<div class="recent-chip" onclick="showDetail('${k}')">${k}</div>`).join('');
}

function renderAlerts(alerts) {
  const box = document.getElementById('alerts-box');
  if (alerts.length === 0) {
    box.innerHTML = '<div style="color:var(--muted);font-size:11px;">✨ Tidak ada alert. Semua tenang.</div>';
    return;
  }
  box.innerHTML = alerts.map(a => `<div class="alert-item alert-${a.tipe}">
    <span class="alert-kode">${a.kode}</span><span>${a.pesan}</span>
  </div>`).join('');
}

function renderSectorHeat(perf) {
  const el = document.getElementById('sector-heat');
  if (perf.length === 0) { el.innerHTML = '<div style="color:var(--muted);font-size:11px;">-</div>'; return; }
  el.innerHTML = perf.map(s => {
    const cls = s.avg > 0.3 ? 'pos' : s.avg < -0.3 ? 'neg' : 'neu';
    const sign = s.avg >= 0 ? '+' : '';
    return `<div class="sector-chip ${cls}" onclick="filterSector('${s.nama}')">
      <div class="sname">${s.nama}</div>
      <div class="sval">${sign}${s.avg}%</div>
      <div class="scount">${s.bull}↑ ${s.bear}↓ (${s.count})</div>
    </div>`;
  }).join('');
}
window.filterSector = (name) => {
  document.getElementById('sectorFilter').value = name;
  currentSector = name;
  render();
};

function buildSectorFilter() {
  const sectors = [...new Set(allData.map(x => x.sektor))].sort();
  const sel = document.getElementById('sectorFilter');
  sel.innerHTML = '<option value="all">Semua Sektor</option>' +
    sectors.map(s => `<option value="${s}">${s}</option>`).join('');
  sel.addEventListener('change', e => { currentSector = e.target.value; render(); });
}

function renderMovers(naik, turun) {
  document.getElementById('top-naik').innerHTML = naik.map(x =>
    `<div class="mover-item" onclick="showDetail('${x.kode}')"><span class="kode-mover">${x.kode}</span><span class="up">+${x.perubahan}%</span></div>`
  ).join('') || '<div style="color:var(--muted);font-size:11px;">-</div>';
  document.getElementById('top-turun').innerHTML = turun.map(x =>
    `<div class="mover-item" onclick="showDetail('${x.kode}')"><span class="kode-mover">${x.kode}</span><span class="down">${x.perubahan}%</span></div>`
  ).join('') || '<div style="color:var(--muted);font-size:11px;">-</div>';
}

function showDetail(kode) {
  const s = allData.find(x => x.kode === kode);
  if (!s) return;
  addRecent(kode);
  const action = s.skor >= 2 ? {cls: 'buy', txt: '📈 Sinyal Beli — Tren Bullish'}
    : s.skor <= -2 ? {cls: 'sell', txt: '📉 Sinyal Jual — Tren Bearish'}
    : {cls: 'hold', txt: '⏸️ Tahan — Belum Ada Sinyal Kuat'};

  const notes = localStorage.getItem('note_' + kode) || '';
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="modal-head">
      <div><h2>${s.kode}</h2>
        <div style="color:var(--muted);font-size:11px;margin-top:2px;">${s.sektor}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div style="font-size:22px;font-weight:700;">
      Rp ${s.harga.toLocaleString('id-ID')}
      <span class="${s.perubahan >= 0 ? 'up' : 'down'}" style="font-size:14px;margin-left:8px;">
        ${s.perubahan >= 0 ? '▲' : '▼'} ${s.perubahan}%
      </span>
    </div>
    <div style="margin-top:8px;font-size:10px;color:var(--muted);">Confidence: ${s.confidence}%</div>
    <div class="modal-chart"><canvas id="modalChart"></canvas></div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="label">MA20</div><div class="val">${s.ma20.toLocaleString('id-ID')}</div></div>
      <div class="modal-stat"><div class="label">MA50</div><div class="val">${s.ma50.toLocaleString('id-ID')}</div></div>
      <div class="modal-stat"><div class="label">RSI</div><div class="val">${s.rsi}</div></div>
      <div class="modal-stat"><div class="label">BB Upper</div><div class="val">${s.bb_up.toLocaleString('id-ID')}</div></div>
      <div class="modal-stat"><div class="label">BB Lower</div><div class="val">${s.bb_low.toLocaleString('id-ID')}</div></div>
      <div class="modal-stat"><div class="label">Vol Ratio</div><div class="val">${s.vol_ratio}x</div></div>
    </div>
    <div class="modal-action action-${action.cls}">${action.txt}</div>
    <div class="modal-section">
      <h4>Alasan Analisis</h4>
      <div style="font-size:11px;color:var(--muted);line-height:1.7;">
        ${s.alasan.map(a => '• ' + a).join('<br>')}
        ${s.sinyal.length ? '<br>' + s.sinyal.map(a => '• ' + a).join('<br>') : ''}
      </div>
    </div>
    <div class="modal-section">
      <h4>Catatan Saya</h4>
      <textarea class="modal-notes" id="modalNotes" placeholder="Tulis catatan...">${notes}</textarea>
    </div>
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="saveNote('${kode}')">💾 Simpan Catatan</button>
      <button class="modal-btn" onclick="shareWA('${kode}')">📱 Share WA</button>
      <button class="modal-btn" onclick="toggleFavFromModal('${kode}')">${favorites.includes(kode) ? '★ Favorit' : '☆ Favorit'}</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
  setTimeout(() => {
    const ctx = document.getElementById('modalChart');
    if (charts.modal) charts.modal.destroy();
    const priceColor = s.perubahan >= 0 ? '#26d07c' : '#ff4d4f';
    charts.modal = new Chart(ctx, {
      type: 'line',
      data: {
        labels: s.historis.map(h => h.tgl),
        datasets: [
          {
            label: 'Harga',
            data: s.historis.map(h => h.harga),
            borderColor: priceColor,
            backgroundColor: priceColor + '15',
            borderWidth: 2, fill: true, tension: 0.35, pointRadius: 0
          },
          {
            label: 'BB Upper',
            data: s.historis.map(h => h.bb_up),
            borderColor: 'rgba(212,168,75,0.5)',
            borderWidth: 1, borderDash: [5, 5], pointRadius: 0, fill: false
          },
          {
            label: 'BB Lower',
            data: s.historis.map(h => h.bb_low),
            borderColor: 'rgba(212,168,75,0.5)',
            borderWidth: 1, borderDash: [5, 5], pointRadius: 0, fill: false
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: {labels: {color: '#7a8699', font: {size: 9}, boxWidth: 10}}
        },
        scales: {
          x: {grid: {color: 'rgba(255,255,255,0.05)'}, ticks: {color: '#7a8699', font: {size: 8}}},
          y: {grid: {color: 'rgba(255,255,255,0.05)'}, ticks: {color: '#7a8699', font: {size: 8}}}
        }
      }
    });
  }, 50);
}
window.showDetail = showDetail;

function saveNote(kode) {
  const v = document.getElementById('modalNotes').value;
  localStorage.setItem('note_' + kode, v);
  alert('Catatan tersimpan!');
}
window.saveNote = saveNote;

function toggleFavFromModal(kode) {
  toggleFav(kode);
  const s = allData.find(x => x.kode === kode);
  if (s) showDetail(kode);
}
window.toggleFavFromModal = toggleFavFromModal;

function shareWA(kode) {
  const s = allData.find(x => x.kode === kode);
  if (!s) return;
  const text = `📊 ${s.kode} - ${s.sektor}%0A` +
    `Harga: Rp ${s.harga.toLocaleString('id-ID')} (${s.perubahan >= 0 ? '+' : ''}${s.perubahan}%)%0A` +
    `MA20: ${s.ma20.toLocaleString('id-ID')} | MA50: ${s.ma50.toLocaleString('id-ID')}%0A` +
    `RSI: ${s.rsi} | Confidence: ${s.confidence}%0A` +
    `Status: ${s.verdict}`;
  window.open('https://wa.me/?text=' + text, '_blank');
}
window.shareWA = shareWA;

function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
window.closeModal = closeModal;

document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') closeModal();
});

function render() {
  const grid = document.getElementById('grid');
  let filtered = allData;

  if (currentFilter === 'bull') filtered = filtered.filter(x => x.skor >= 0.5);
  else if (currentFilter === 'bear') filtered = filtered.filter(x => x.skor <= -0.5);
  else if (currentFilter === 'fav') filtered = filtered.filter(x => favorites.includes(x.kode));
  else if (currentFilter === 'bb') filtered = filtered.filter(x => x.harga >= x.bb_up || x.harga <= x.bb_low);

  if (currentSector !== 'all') filtered = filtered.filter(x => x.sektor === currentSector);
  if (currentSearch) filtered = filtered.filter(x => x.kode.toLowerCase().includes(currentSearch.toLowerCase()));

  const sorts = {
    skor: (a, b) => b.skor - a.skor,
    perubahan: (a, b) => b.perubahan - a.perubahan,
    harga: (a, b) => b.harga - a.harga,
    rsi: (a, b) => b.rsi - a.rsi,
    confidence: (a, b) => b.confidence - a.confidence
  };
  filtered.sort(sorts[currentSort] || sorts.skor);

  document.getElementById('count-info').textContent = filtered.length + ' / ' + allData.length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">Tidak ada saham yang cocok.</div>';
    return;
  }

  Object.keys(charts).forEach(k => {
    if (k !== 'modal') { charts[k].destroy(); delete charts[k]; }
  });

  grid.innerHTML = filtered.map((s, i) => {
    const up = s.perubahan >= 0;
    const isFav = favorites.includes(s.kode);
    return `<div class="card ${s.level}" onclick="showDetail('${s.kode}')">
      <button class="star ${isFav ? 'on' : ''}" onclick="event.stopPropagation();toggleFav('${s.kode}')">${isFav ? '★' : '☆'}</button>
      <div class="card-head">
        <div><div class="kode">${s.kode}</div><div class="sektor">${s.sektor}</div></div>
      </div>
      <div class="verdict v-${s.level}">${s.verdict}</div>
      <div class="harga" style="margin-top:6px;">Rp <span>${s.harga.toLocaleString('id-ID')}</span> · <span class="${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${up ? '+' : ''}${s.perubahan}%</span></div>
      <div class="conf-bar"><span>CONF</span><div class="bar"><div style="width:${s.confidence}%"></div></div><span>${s.confidence}%</span></div>
      <div class="chart-wrap"><canvas id="chart-${i}"></canvas></div>
      <div class="metrics">
        <div class="metric"><div class="label">MA20</div><div class="val">${s.ma20.toLocaleString('id-ID')}</div></div>
        <div class="metric"><div class="label">MA50</div><div class="val">${s.ma50.toLocaleString('id-ID')}</div></div>
        <div class="metric"><div class="label">RSI</div><div class="val">${s.rsi}</div></div>
      </div>
      ${s.sinyal.length ? '<div class="sinyal">' + s.sinyal.map(x => '<span class="sinyal-item">' + x + '</span>').join('') + '</div>' : ''}
    </div>`;
  }).join('');

  filtered.forEach((s, i) => {
    if (!s.historis || s.historis.length === 0) return;
    const ctx = document.getElementById('chart-' + i);
    if (!ctx) return;
    const color = s.perubahan >= 0 ? '#26d07c' : '#ff4d4f';
    charts['c-' + i] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: s.historis.map(h => h.tgl),
        datasets: [{data: s.historis.map(h => h.harga), borderColor: color, backgroundColor: color + '20', borderWidth: 1.5, fill: true, tension: 0.35, pointRadius: 0}]
      },
      options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {display: false}, y: {display: false}}, interaction: {intersect: false, mode: 'index'}}
    });
  });
}

document.getElementById('search').addEventListener('input', e => { currentSearch = e.target.value; render(); });
document.getElementById('sortFilter').addEventListener('change', e => { currentSort = e.target.value; render(); });
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

loadData();
</script>

</body>
</html>
