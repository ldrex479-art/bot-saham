<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saham Indonesia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #f3f4f6;
            line-height: 1.5;
        }

        /* ============ HEADER ============ */
        .header {
            background: #111827;
            border-bottom: 1px solid #2d3748;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 20px;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
        }
        /* LOGO GAMBAR SVG */
        .logo-img {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: block;
        }
        .logo-text-wrap {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .logo-text-main {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .logo-text-sub {
            font-size: 0.62rem;
            color: #6b7280;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .header-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.75rem; color: #9ca3af;
            background: #1a2332;
            padding: 5px 12px; border-radius: 16px;
            border: 1px solid #2d3748;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .search-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px;
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .search-btn:hover { border-color: #3b82f6; color: #f3f4f6; }
        .search-btn kbd {
            padding: 1px 5px;
            background: #111827;
            border-radius: 3px;
            font-size: 0.65rem;
            border: 1px solid #2d3748;
        }

        /* ============ MAIN ============ */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ============ TICKER ============ */
        .ticker-wrap {
            background: #111827;
            border: 1px solid #2d3748;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .ticker-label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ticker {
            display: flex;
            animation: ticker 40s linear infinite;
            white-space: nowrap;
            padding: 10px 0;
        }
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            font-size: 0.8rem;
            border-right: 1px solid #2d3748;
        }
        .ticker-symbol { font-weight: 700; }
        .ticker-price { color: #9ca3af; }
        .ticker-change.up { color: #10b981; }
        .ticker-change.down { color: #ef4444; }

        /* ============ STATS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 16px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #3b82f6, transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .stat-card:hover { border-color: #3b82f6; }
        .stat-card:hover::after { opacity: 1; }
        .stat-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .stat-card-title {
            font-size: 0.72rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .stat-card-icon {
            width: 34px; height: 34px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
        }
        .stat-card-icon.green { background: rgba(16,185,129,0.15); color: #10b981; }
        .stat-card-icon.red { background: rgba(239,68,68,0.15); color: #ef4444; }
        .stat-card-icon.blue { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .stat-card-icon.gold { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .stat-card-icon.purple { background: rgba(139,92,246,0.15); color: #8b5cf6; }
        .stat-card-icon.cyan { background: rgba(6,182,212,0.15); color: #06b6d4; }

        .stat-card-value {
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 3px;
        }
        .stat-card-label {
            font-size: 0.72rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============ SECTION ============ */
        .section { margin-bottom: 20px; }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i { color: #3b82f6; font-size: 0.95rem; }

        /* ============ SENTIMENT ============ */
        .sentiment-card {
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 16px;
        }
        .sentiment-bar {
            height: 8px;
            border-radius: 4px;
            background: #111827;
            overflow: hidden;
            display: flex;
            margin: 12px 0;
        }
        .sentiment-fill { height: 100%; transition: width 0.5s; }
        .sentiment-bull { background: #10b981; }
        .sentiment-bear { background: #ef4444; }
        .sentiment-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #9ca3af;
        }
        .sentiment-labels span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============ SECTOR ============ */
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .sector-item {
            background: #111827;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }
        .sector-item:hover {
            border-color: #3b82f6;
            transform: scale(1.02);
        }
        .sector-name {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sector-name i {
            font-size: 0.7rem;
            color: #3b82f6;
        }
        .sector-value {
            font-size: 1rem;
            font-weight: 700;
        }
        .sector-value.up { color: #10b981; }
        .sector-value.down { color: #ef4444; }
        .sector-detail {
            font-size: 0.65rem;
            color: #6b7280;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sector-detail i {
            font-size: 0.55rem;
        }

        /* ============ MOVERS ============ */
        .movers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 768px) {
            .movers-grid { grid-template-columns: 1fr; }
        }
        .mover-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #111827;
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .mover-item:hover { background: #243044; }
        .mover-info { display: flex; align-items: center; gap: 10px; }
        .mover-avatar {
            width: 32px; height: 32px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            background: #1a2332;
            color: #3b82f6;
            border: 1px solid #2d3748;
        }
        .mover-symbol { font-weight: 700; font-size: 0.85rem; }
        .mover-name { font-size: 0.7rem; color: #6b7280; }
        .mover-change {
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mover-change.up { color: #10b981; }
        .mover-change.down { color: #ef4444; }

        /* ============ TABLE ============ */
        .stock-table-wrap {
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 10px;
            overflow: hidden;
        }
        .stock-table {
            width: 100%;
            border-collapse: collapse;
        }
        .stock-table th {
            text-align: left;
            padding: 10px 14px;
            font-size: 0.7rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2d3748;
            font-weight: 600;
        }
        .stock-table th i {
            margin-right: 4px;
            font-size: 0.65rem;
        }
        .stock-table td {
            padding: 11px 14px;
            border-bottom: 1px solid #2d3748;
            font-size: 0.85rem;
        }
        .stock-table tr {
            cursor: pointer;
            transition: background 0.2s;
        }
        .stock-table tr:hover { background: #243044; }
        .stock-symbol { font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .stock-symbol i { font-size: 0.6rem; color: #3b82f6; }
        .stock-name { font-size: 0.7rem; color: #6b7280; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .badge i { font-size: 0.55rem; }
        .badge.bullish { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge.bearish { background: rgba(239,68,68,0.15); color: #ef4444; }
        .badge.neutral { background: rgba(107,114,128,0.15); color: #9ca3af; }
        .badge.very-bearish { background: rgba(239,68,68,0.25); color: #fca5a5; }

        .confidence-bar {
            width: 50px; height: 5px;
            background: #111827;
            border-radius: 3px;
            overflow: hidden;
        }
        .confidence-fill { height: 100%; border-radius: 3px; }
        .confidence-fill.high { background: #10b981; }
        .confidence-fill.medium { background: #f59e0b; }
        .confidence-fill.low { background: #6b7280; }

        /* ============ FILTERS ============ */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 6px 14px;
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 16px;
            color: #9ca3af;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        /* ============ COMMAND PALETTE ============ */
        .command-palette {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 15vh;
        }
        .command-palette.active { display: flex; }
        .command-box {
            width: 100%;
            max-width: 550px;
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 25px rgba(0,0,0,0.5);
        }
        .command-input {
            width: 100%;
            padding: 14px 18px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #2d3748;
            color: #f3f4f6;
            font-size: 0.95rem;
            outline: none;
        }
        .command-input::placeholder { color: #6b7280; }
        .command-results { max-height: 280px; overflow-y: auto; }
        .command-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .command-item:hover { background: #243044; }
        .command-item i { width: 18px; text-align: center; color: #6b7280; }
        .command-item span { font-size: 0.85rem; }
        .command-item kbd {
            margin-left: auto;
            padding: 2px 6px;
            background: #111827;
            border-radius: 3px;
            font-size: 0.65rem;
            border: 1px solid #2d3748;
        }

        /* ============ TOAST ============ */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 8px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
            min-width: 280px;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .toast.success { border-left: 3px solid #10b981; }
        .toast.warning { border-left: 3px solid #f59e0b; }
        .toast.error { border-left: 3px solid #ef4444; }
        .toast-icon {
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
        }
        .toast.success .toast-icon { background: rgba(16,185,129,0.15); color: #10b981; }
        .toast.warning .toast-icon { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .toast.error .toast-icon { background: rgba(239,68,68,0.15); color: #ef4444; }
        .toast-content { flex: 1; }
        .toast-title { font-size: 0.8rem; font-weight: 700; }
        .toast-message { font-size: 0.7rem; color: #9ca3af; }

        /* ============ PREMIUM ============ */
        .premium-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }
        .premium-card {
            background: #1a2332;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .premium-card:hover {
            border-color: #f59e0b;
            box-shadow: 0 0 25px rgba(245,158,11,0.1);
        }
        .premium-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #f59e0b, #8b5cf6);
        }
        .premium-icon {
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }
        .premium-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .premium-title i { color: #f59e0b; font-size: 0.8rem; }
        .premium-desc {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .premium-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .premium-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245,158,11,0.4);
        }
        .premium-btn.outline {
            background: transparent;
            border: 1px solid #f59e0b;
            color: #f59e0b;
        }
        .premium-btn.outline:hover { background: rgba(245,158,11,0.1); }

        /* ============ SIGNAL CARD ============ */
        .signal-card {
            background: #111827;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .signal-icon {
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem;
        }
        .signal-icon.buy { background: rgba(16,185,129,0.15); color: #10b981; }
        .signal-icon.sell { background: rgba(239,68,68,0.15); color: #ef4444; }
        .signal-icon.hold { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .signal-info { flex: 1; }
        .signal-title { font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
        .signal-title i { font-size: 0.7rem; }
        .signal-desc { font-size: 0.7rem; color: #6b7280; }
        .signal-action {
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .signal-action.buy { background: rgba(16,185,129,0.15); color: #10b981; }
        .signal-action.sell { background: rgba(239,68,68,0.15); color: #ef4444; }
        .signal-action.hold { background: rgba(245,158,11,0.15); color: #f59e0b; }

        /* ============ PORTFOLIO ============ */
        .portfolio-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #111827;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .portfolio-info { display: flex; align-items: center; gap: 10px; }
        .portfolio-symbol { font-weight: 700; font-size: 0.85rem; }
        .portfolio-lots { font-size: 0.7rem; color: #6b7280; }
        .portfolio-value { text-align: right; }
        .portfolio-price { font-weight: 700; font-size: 0.85rem; }
        .portfolio-pnl {
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 3px;
            justify-content: flex-end;
        }
        .portfolio-pnl.up { color: #10b981; }
        .portfolio-pnl.down { color: #ef4444; }

        /* ============ ALERT ============ */
        .alert-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #111827;
            border-radius: 8px;
            margin-bottom: 6px;
            border-left: 3px solid #f59e0b;
        }
        .alert-symbol {
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .alert-symbol i { color: #f59e0b; font-size: 0.7rem; }
        .alert-condition { font-size: 0.7rem; color: #6b7280; }
        .alert-status {
            font-size: 0.65rem;
            padding: 3px 9px;
            border-radius: 10px;
            background: rgba(16,185,129,0.15);
            color: #10b981;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============ CALCULATOR ============ */
        .calc-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .calc-tab {
            padding: 7px 14px;
            background: #111827;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #9ca3af;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .calc-tab.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .calc-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 768px) {
            .calc-form { grid-template-columns: 1fr; }
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label {
            font-size: 0.75rem;
            color: #9ca3af;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
